# This file generates the GitHub Actions matrix.
# Dongle setup: the dongle connects to the computer, both halves connect to the dongle.
---
include:
  # Dongle (central)
  - board: nice_nano_v2
    shield: sofle_dongle

  # Halves, built as peripherals of the dongle
  - board: nice_nano_v2
    shield: sofle_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano_v2
    shield: sofle_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Flash on all three boards before flashing the firmware above
  - board: nice_nano_v2
    shield: settings_reset
